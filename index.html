<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050811">
<title>LAFASCO - MELBET Apple of Fortune</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at top,#0f1c38 0%,#050811 72%);
  color:#fff;margin:0;min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:10px
}
.box{
  width:100%;max-width:400px;
  background:linear-gradient(165deg,#0d162a,#060913);
  border:1.5px solid rgba(59,130,246,.55);
  border-radius:22px;padding:14px;
  box-shadow:0 14px 36px rgba(0,0,0,.65),0 0 24px rgba(37,99,235,.25)
}
.top{
  background:rgba(37,99,235,.14);
  border:1px solid rgba(96,165,250,.35);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12px
}
.rf{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.rf:last-child{margin-bottom:0}
.uid{color:#38bdf8;font-weight:700}
.badge{
  background:rgba(234,179,8,.2);color:#fde047;
  border:1px solid rgba(250,204,21,.45);
  padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700
}
.brand{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;padding:0 4px
}
.b-name{color:#fca5a5;font-weight:800;letter-spacing:1.5px;font-size:17px}
.tg-pill{
  background:rgba(14,165,233,.18);color:#7dd3fc;
  border:1px solid rgba(56,189,248,.4);
  padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:700;cursor:pointer
}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;font-size:12px}
.stat{
  background:#0f172a;border:1px solid #1e293b;
  border-radius:10px;padding:7px;text-align:center;color:#94a3b8
}
.stat b{display:block;color:#38bdf8;font-size:14px;margin-top:2px}
.board{
  background:rgba(0,0,0,.55);border:1px solid #1e293b;
  border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px
}
.gr{
  display:grid;grid-template-columns:56px repeat(5,1fr);gap:5px;
  align-items:center;padding:3px;border-radius:9px;border:1px solid transparent
}
.gr.active{background:rgba(37,99,235,.22);border-color:#38bdf8}
.gr.dim{opacity:.45}
.m{
  background:#0f172a;border:1px solid #1e293b;border-radius:7px;
  padding:6px 2px;text-align:center;font-size:11px;font-weight:700;color:#94a3b8
}
.gr.active .m{color:#38bdf8;border-color:#38bdf8}
.c{
  height:38px;background:#131c31;border:1px solid #2d3748;border-radius:8px;
  display:flex;justify-content:center;align-items:center;
  font-size:16px;font-weight:800;cursor:pointer;user-select:none
}
.c.hint{border-color:#38bdf8;background:rgba(56,189,248,.24);box-shadow:0 0 10px rgba(56,189,248,.5)}
.c.win{border-color:#10b981;background:rgba(16,185,129,.22);color:#bbf7d0}
.c.lose{border-color:#ef4444;background:rgba(239,68,68,.26);color:#fca5a5}
.c.pick{box-shadow:0 0 0 2px #facc15}
.msg{
  margin-top:9px;background:#0f172a;border:1px solid #1e293b;
  border-radius:10px;padding:8px;font-size:12px;text-align:center;
  color:#e2e8f0;min-height:34px;display:flex;align-items:center;justify-content:center
}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
button{
  border:none;border-radius:10px;padding:10px 4px;
  font-weight:700;font-size:12px;color:#fff;cursor:pointer
}
.b1{background:#2563eb}.b2{background:#7c3aed}.b3{background:#059669}.b4{background:#1e293b;color:#cbd5e1;border:1px solid #334155}
.tg-bar{
  margin-top:9px;background:rgba(14,165,233,.12);
  border:1px dashed rgba(56,189,248,.45);border-radius:10px;
  padding:7px 10px;font-size:11px;color:#bae6fd;
  display:flex;justify-content:space-between;align-items:center;gap:8px
}
.tg-btn{
  background:#0284c7;color:#fff;border:none;border-radius:7px;
  padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap
}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <div class="rf"><div>ID: <span class="uid" id="uidVal">1383505763</span></div><span class="badge">MELBET</span></div>
    <div class="rf"><div>Signals: <span class="uid" id="sig">55</span></div><span style="color:#34d399;font-size:11px" id="connStatus">● متصل</span></div>
  </div>

  <div class="brand">
    <span class="b-name">🎭 LAFASCO</span>
    <span class="tg-pill" id="tgBadge">TELEGRAM APP</span>
  </div>

  <div class="stats">
    <div class="stat">جولات ناجحة<b id="wins">0</b></div>
    <div class="stat">أعلى مضاعف<b id="best">-</b></div>
  </div>

  <div class="board" id="board">
    <div class="gr dim" id="r0"><div class="m">x27.97</div><div class="c" id="c0_0"></div><div class="c" id="c0_1"></div><div class="c" id="c0_2"></div><div class="c" id="c0_3"></div><div class="c" id="c0_4"></div></div>
    <div class="gr dim" id="r1"><div class="m">x11.18</div><div class="c" id="c1_0"></div><div class="c" id="c1_1"></div><div class="c" id="c1_2"></div><div class="c" id="c1_3"></div><div class="c" id="c1_4"></div></div>
    <div class="gr dim" id="r2"><div class="m">x6.71</div><div class="c" id="c2_0"></div><div class="c" id="c2_1"></div><div class="c" id="c2_2"></div><div class="c" id="c2_3"></div><div class="c" id="c2_4"></div></div>
    <div class="gr dim" id="r3"><div class="m">x4.02</div><div class="c" id="c3_0"></div><div class="c" id="c3_1"></div><div class="c" id="c3_2"></div><div class="c" id="c3_3"></div><div class="c" id="c3_4"></div></div>
    <div class="gr dim" id="r4"><div class="m">x2.41</div><div class="c" id="c4_0"></div><div class="c" id="c4_1"></div><div class="c" id="c4_2"></div><div class="c" id="c4_3"></div><div class="c" id="c4_4"></div></div>
    <div class="gr dim" id="r5"><div class="m">x1.93</div><div class="c" id="c5_0"></div><div class="c" id="c5_1"></div><div class="c" id="c5_2"></div><div class="c" id="c5_3"></div><div class="c" id="c5_4"></div></div>
    <div class="gr dim" id="r6"><div class="m">x1.54</div><div class="c" id="c6_0"></div><div class="c" id="c6_1"></div><div class="c" id="c6_2"></div><div class="c" id="c6_3"></div><div class="c" id="c6_4"></div></div>
    <div class="gr active" id="r7"><div class="m">x1.23</div><div class="c" id="c7_0"></div><div class="c" id="c7_1"></div><div class="c" id="c7_2"></div><div class="c" id="c7_3"></div><div class="c" id="c7_4"></div></div>
  </div>

  <div class="msg" id="msg">اختر تفاحة في الصف السفلي أو اضغط "إشارة"</div>

  <div class="btns">
    <button type="button" class="b1" onclick="hint()">🎯 إشارة</button>
    <button type="button" class="b2" onclick="autoPlay()">⚡ تلقائي</button>
    <button type="button" class="b3" onclick="take()">💰 سحب</button>
    <button type="button" class="b4" onclick="resetAll()">🔄 إعادة</button>
  </div>

  <div class="tg-bar">
    <span id="tgInfo">متاح للتشغيل كـ Telegram Mini App</span>
    <button type="button" class="tg-btn" onclick="tgAction()">📲 تيليغرام</button>
  </div>
</div>

<script>
// تهيئة بيئة تيليغرام المصغرة (Telegram Mini App) إذا فُتحت داخل تيليغرام
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#050811");
  tg.setBackgroundColor("#050811");
  document.getElementById("tgBadge").textContent = "TG MINI APP";
  document.getElementById("tgInfo").textContent = "مرتبط بواجهة Telegram WebApp";
  if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
    document.getElementById("uidVal").textContent = tg.initDataUnsafe.user.id;
  }
}

function tgAction() {
  if (tg) {
    tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium");
    msg("📲 التطبيق يعمل داخل Telegram WebApp بنجاح.");
  } else {
    msg("💡 لرفعه كتطبيق في تيليغرام: ارفع ملف HTML على استضافة (مثل GitHub Pages) واربطه بـ @BotFather عبر /newapp");
  }
}

var mults = ["x27.97","x11.18","x6.71","x4.02","x2.41","x1.93","x1.54","x1.23"];
var traps = [4,4,3,3,2,2,1,1];
var rowNow = 7, sigs = 55, over = false, grid = [], wins = 0, bestNum = 0;

function msg(t){ document.getElementById("msg").textContent = t; }

function syncRows(){
  for(var r=0; r<8; r++){
    var rowEl = document.getElementById("r"+r);
    rowEl.className = "gr" + (!over && r===rowNow ? " active" : (r>=rowNow ? "" : " dim"));
  }
}

function showRow(r, picked){
  for(var c=0; c<5; c++){
    var el = document.getElementById("c"+r+"_"+c);
    var ok = grid[r][c];
    el.className = "c " + (ok ? "win" : "lose") + (c===picked ? " pick" : "");
    el.textContent = ok ? "🍎" : "🍎✗";
  }
}

function pick(r, c){
  if(over || r !== rowNow) return;
  var ok = grid[r][c];
  var m = mults[r];
  showRow(r, c);
  if(ok){
    var n = parseFloat(m.slice(1));
    if(n > bestNum){ bestNum = n; document.getElementById("best").textContent = m; }
    if(rowNow === 0){
      over = true; wins++; document.getElementById("wins").textContent = wins;
      syncRows(); msg("🏆 وصلت إلى القمة (x27.97) — تفاحة حمراء سليمة!");
    } else {
      rowNow--; syncRows();
      msg("🍎 تفاحة حمراء سليمة ("+m+") — التالي: "+mults[rowNow]);
    }
  } else {
    over = true; syncRows();
    msg("❌ تفاحة مأكولة! انتهت الجولة، اضغط إعادة.");
  }
}

function getSafe(r){
  var arr = [];
  for(var i=0; i<5; i++) if(grid[r][i]) arr.push(i);
  return arr[Math.floor(Math.random()*arr.length)];
}

function hint(){
  if(over) return msg("الجولة منتهية، اضغط إعادة.");
  if(sigs <= 0) return msg("نفدت الإشارات، اضغط إعادة.");
  sigs--; document.getElementById("sig").textContent = sigs;
  var idx = getSafe(rowNow);
  var el = document.getElementById("c"+rowNow+"_"+idx);
  el.className = "c hint win";
  el.textContent = "🍎";
  msg("🎯 إشارة ("+mults[rowNow]+"): التفاحة رقم "+(idx+1)+" حمراء وسليمة.");
}

function autoPlay(){
  if(over) return msg("الجولة منتهية، اضغط إعادة.");
  if(sigs <= 0) return msg("نفدت الإشارات، اضغط إعادة.");
  sigs--; document.getElementById("sig").textContent = sigs;
  pick(rowNow, getSafe(rowNow));
}

function take(){
  if(over) return msg("اضغط إعادة لبدء جولة جديدة.");
  if(rowNow === 7) return msg("اختر تفاحة أولاً قبل السحب.");
  var m = mults[rowNow+1];
  wins++; document.getElementById("wins").textContent = wins;
  var n = parseFloat(m.slice(1));
  if(n > bestNum){ bestNum = n; document.getElementById("best").textContent = m; }
  over = true; syncRows();
  msg("💰 تم السحب بنجاح عند مضاعف "+m);
}

function resetAll(){
  rowNow = 7; sigs = 55; over = false; grid = [];
  document.getElementById("sig").textContent = sigs;
  for(var r=0; r<8; r++){
    var arr = [true,true,true,true,true], cnt = 0;
    while(cnt < traps[r]){
      var idx = Math.floor(Math.random()*5);
      if(arr[idx]){ arr[idx] = false; cnt++; }
    }
    grid.push(arr);
    for(var c=0; c<5; c++){
      var el = document.getElementById("c"+r+"_"+c);
      el.className = "c";
      el.textContent = "🍏";
      el.onclick = (function(rr, cc){ return function(){ pick(rr, cc); }; })(r, c);
    }
  }
  syncRows();
  msg('اختر تفاحة في الصف السفلي أو اضغط "إشارة"');
}

resetAll();
</script>
</body>
</html>
